name: Generated Files

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: lts/jod
  # Needed while root package.json overrides pin @cowprotocol SDK previews to GitHub Packages;
  # .npmrc reads this token to auth against npm.pkg.github.com.
  PACKAGE_READ_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_AUTH_TOKEN }}

jobs:
  generated-files:
    name: Update generated files
    runs-on: ubuntu-latest
    # Only run for PRs from the same repo (GITHUB_TOKEN can't push to forks)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm run install:ci

      - name: Extract i18n strings
        run: pnpm run i18n:extract

      - name: Build projects
        run: pnpm build:all
        env:
          BUNDLE_SIZE_BUILD: 'true'

      - name: Measure bundle sizes
        run: pnpm bundle:size

      - name: Check for generated changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        if: steps.changes.outputs.has_changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.COWSWAP_RELEASE_SYNC_APP_ID }}
          private-key: ${{ secrets.COWSWAP_RELEASE_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Resolve GitHub App bot identity
        if: steps.changes.outputs.has_changes == 'true'
        id: app-user
        run: |
          set -euo pipefail
          user_id=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" \
            | jq -r .id)
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Configure GitHub App bot identity
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}

      - name: Commit i18n strings
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add 'apps/cowswap-frontend/src/locales/*.po'
          if git diff --cached --quiet; then
            echo "i18n strings unchanged, nothing to commit"
          else
            git commit -m "chore(i18n): extract i18n strings [automatic]"
          fi

      - name: Commit generated files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A -- . ':(exclude)bundle-size.jsonc'
          if git diff --cached --quiet; then
            echo "Generated files unchanged, nothing to commit"
          else
            git commit -m "chore: update generated files [automatic]"
          fi

      - name: Commit bundle sizes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add bundle-size.jsonc
          if git diff --cached --quiet; then
            echo "Bundle sizes unchanged, nothing to commit"
          else
            git commit -m "chore: update bundle sizes [automatic]"
          fi

      - name: Push generated changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
