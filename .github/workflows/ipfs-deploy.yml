name: ipfs deploy

on:
  workflow_run:
    workflows: [ipfs]
    types: [requested]

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: lts/jod
  REACT_APP_ENVIRONMENT: ens

jobs:
  ipfs:
    name: IPFS
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: cowswap-ipfs
      deployment: false

    steps:
      - name: Checkout trusted workflow repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout tagged commit to deploy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          path: deploy-target

      - name: Verify tag points to main
        working-directory: deploy-target
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_branch }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node ../tools/scripts/verify-tag-reachable-from-main.mjs

      - name: Create GitHub deployment for release tag
        id: create-deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_branch }}
        with:
          result-encoding: string
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.DEPLOY_REF,
              environment: 'cowswap-ipfs',
              auto_merge: false,
              required_contexts: [],
            })
            return String(deployment.id)

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: deploy-target/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: deploy-target
        run: pnpm install --frozen-lockfile

      - name: Build Web Apps
        working-directory: deploy-target
        run: pnpm run build:cowswap
        env:
          REACT_APP_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          REACT_APP_BFF_BASE_URL: ${{ secrets.BFF_BASE_URL }}
          REACT_APP_BALANCES_WATCHER_BASE_URL: ${{ secrets.REACT_APP_BALANCES_WATCHER_BASE_URL }}
          REACT_APP_CMS_BASE_URL: ${{ secrets.CMS_BASE_URL }}
          REACT_APP_TURNSTILE_SITE_KEY: ${{ secrets.REACT_APP_TURNSTILE_SITE_KEY }}
          REACT_APP_LAUNCH_DARKLY_KEY: ${{ secrets.REACT_APP_LAUNCH_DARKLY_KEY }}
          REACT_APP_NEAR_API_KEY: ${{ secrets.REACT_APP_NEAR_API_KEY }}
          REACT_APP_SAFE_API_AUTH_TOKEN: ${{ secrets.REACT_APP_SAFE_API_AUTH_TOKEN }}

      - name: Deploy Web Apps to IPFS
        id: deploy-ipfs
        working-directory: deploy-target
        run: |
          set -euo pipefail

          output="$(npx ipfs-deploy build/cowswap -p pinata -O)"
          printf '%s\n' "$output"

          cid="$(printf '%s\n' "$output" | node ../tools/scripts/extract-ipfs-deployment.mjs)"
          url="https://dweb.link/ipfs/${cid}/"
          fallback_url="https://inbrowser.link/ipfs/${cid}/"

          echo "cid=${cid}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "fallback_url=${fallback_url}" >> "$GITHUB_OUTPUT"
          {
            echo "### IPFS deployment"
            echo
            echo "- Source tag: \`${DEPLOY_REF}\`"
            echo "- Source SHA: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- CID: \`${cid}\`"
            echo "- Primary URL: ${url}"
            echo "- Fallback URL: ${fallback_url}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_branch }}
          IPFS_DEPLOY_PINATA__API_KEY: ${{ secrets.REACT_APP_PINATA_API_KEY }}
          IPFS_DEPLOY_PINATA__SECRET_API_KEY: ${{ secrets.REACT_APP_PINATA_SECRET_API_KEY }}

      - name: Pin with secondary providers
        id: pin-secondary
        if: steps.deploy-ipfs.outcome == 'success'
        working-directory: deploy-target
        run: node ../tools/scripts/ipfs-pin-secondary.mjs "$CID"
        env:
          CID: ${{ steps.deploy-ipfs.outputs.cid }}
          IPFS_4EVERLAND_ACCESS_TOKEN: ${{ secrets.IPFS_4EVERLAND_ACCESS_TOKEN }}
          IPFS_NINJA_API_KEY: ${{ secrets.IPFS_NINJA_API_KEY }}

      - name: Complete GitHub deployment
        id: complete-deployment
        if: always() && steps.create-deployment.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.result }}
          DEPLOYMENT_STATE: ${{ steps.deploy-ipfs.outcome == 'success' && steps.pin-secondary.outcome == 'success' && 'success' || 'failure' }}
          DEPLOYMENT_URL: ${{ steps.deploy-ipfs.outputs.url }}
        with:
          script: |
            const status = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.DEPLOYMENT_STATE,
            }
            if (status.state === 'success') {
              status.environment_url = process.env.DEPLOYMENT_URL
            }
            await github.rest.repos.createDeploymentStatus(status)
