name: cow.fi CMS resilience

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'apps/cow-fi/**'
      - 'libs/**'
      - 'tools/scripts/cow-fi-cms-resilience*'
      - '.github/workflows/cow-fi-cms-resilience.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
  push:
    branches: [develop, main]
    paths:
      - 'apps/cow-fi/**'
      - 'libs/**'
      - 'tools/scripts/cow-fi-cms-resilience*'
      - '.github/workflows/cow-fi-cms-resilience.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'

permissions:
  contents: read

jobs:
  cms-resilience:
    name: CMS resilience
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/jod
          cache: pnpm
      - name: Install dependencies
        run: pnpm run install:ci
        env:
          PACKAGE_READ_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_AUTH_TOKEN }}
      - name: Test production pages with unavailable and malformed CMS content
        run: pnpm exec nx run cow-fi:test-cms-resilience
      - name: Upload build and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cow-fi-cms-resilience
          path: apps/cow-fi/.next-cms-resilience/*.log
          if-no-files-found: ignore
